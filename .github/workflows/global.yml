name: global-indicators
on:
  schedule:
    # 정각·15분·30분·40분 몰림 시각을 피해 분을 옮기고, 각 시간대마다 30분 안팎의 보조 실행을 둠 (2026-11-11: 예약 실행이 5~9시간 지연·누락되는 문제 대응)
    - cron: '17 21 * * 1-5'   # KST 06:17 화~토 (미국 정규장 마감 뒤)
    - cron: '47 21 * * 1-5'   # KST 06:47 화~토 (보조)
    - cron: '53 22 * * 0-4'   # KST 07:53 월~금 (보조)
    - cron: '43 23 * * 0-4'   # KST 08:43 월~금 (한국장 개장 전, 선물 반영)
    - cron: '38 6 * * 1-5'    # KST 15:38 월~금 (한국장 마감 뒤)
    - cron: '8 7 * * 1-5'     # KST 16:08 월~금 (보조)
    - cron: '33 13 * * 1-5'   # KST 22:33 월~금 (미국 장 초반)
    - cron: '3 14 * * 1-5'    # KST 23:03 월~금 (보조)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-indicators
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: collect
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect_global.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/global.json
          git diff --cached --quiet || (git commit -m "global indicators $(date -u +%FT%H:%MZ)" && git pull --rebase origin main && git push)
